<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Blossom</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blossom">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta id="theme-color" name="theme-color" content="#eeeeeb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
@font-face{font-family:'Montserrat';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/montserrat-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/montserrat-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/montserrat-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/montserrat-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/poppins-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/poppins-latin-500-normal.woff2) format('woff2')}
/* Layout: one phone-width column on a warm grey ground; one colour means one thing (pink = period, yellow = ovulation) */
:root{
  --bg:#eeeeeb; --surface:#ffffff; --ink:#323232; --muted:#75746e; --ring:#adaca5; --track:#eeeeeb; --bud:#eeeeeb;
  --brand:#f48292; --on-brand:#ffffff; --danger:#c9505b; --scrim:rgba(50,50,50,.35);
  --card-mix:100%; --glow-op:1; --glow-s:1;
  --f-ui:'Montserrat','PingFang TC','Noto Sans TC',system-ui,sans-serif;
  --f-num:'Poppins','Montserrat',system-ui,sans-serif;
}
/* dark mode is provisional: same neutrals as Slow Growing until the dark palette is designed */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#323232; --surface:#424242; --ink:#eeeeeb; --muted:#b3b2ab; --ring:#8f8e88; --track:#383838; --bud:#565654;
    --danger:#ec8a93; --scrim:rgba(0,0,0,.5); --card-mix:78%; --glow-op:.4; --glow-s:.86; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#323232; --surface:#424242; --ink:#eeeeeb; --muted:#b3b2ab; --ring:#8f8e88; --track:#383838; --bud:#565654;
  --danger:#ec8a93; --scrim:rgba(0,0,0,.5); --card-mix:78%; --glow-op:.4; --glow-s:.86; color-scheme:dark;
}
/* the logo switch inside the app wins over the system setting */
:root[data-app="light"]{
  --bg:#eeeeeb; --surface:#ffffff; --ink:#323232; --muted:#75746e; --ring:#adaca5; --track:#eeeeeb; --bud:#eeeeeb;
  --danger:#c9505b; --scrim:rgba(50,50,50,.35); --card-mix:100%; --glow-op:1; --glow-s:1; color-scheme:light;
}
:root[data-app="dark"]{
  --bg:#323232; --surface:#424242; --ink:#eeeeeb; --muted:#b3b2ab; --ring:#8f8e88; --track:#383838; --bud:#565654;
  --danger:#ec8a93; --scrim:rgba(0,0,0,.5); --card-mix:78%; --glow-op:.4; --glow-s:.86; color-scheme:dark;
}

html,body{min-height:100%;margin:0}
html{-webkit-text-size-adjust:100%}
html,body{overscroll-behavior:none}
/* the main page is pinned: no scrolling, no rubber-band */
html.lock,html.lock body{height:100%;overflow:hidden}
/* switching light/dark: everything changes colour together, at one speed */
html.theming *,html.theming *::before,html.theming *::after{transition:background-color .5s ease,color .5s ease,border-color .5s ease,fill .5s ease,box-shadow .5s ease!important;transition-delay:0s!important}
body{-webkit-touch-callout:none;padding-top:env(safe-area-inset-top,0px);-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);transition:background-color .5s ease,color .5s ease;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
#app{max-width:430px;margin:0 auto;padding-inline:24px;box-sizing:border-box;overflow-x:hidden;min-height:100%}
.screen{padding-block:28px 56px;display:flex;flex-direction:column;gap:26px}
.screen.tight{gap:16px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:6px;min-width:0}
.logo{width:48px;height:48px;margin-left:-4px;border:none;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%}
.logo svg{width:36px;height:36px;overflow:visible}
h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.iconbtn{width:48px;height:48px;border:none;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;color:var(--ring)}

/* tabs */
.tabs{display:flex;justify-content:center;gap:8px}
.tab{width:88px;height:40px;border:none;border-radius:999px;font-size:11px;font-weight:500;letter-spacing:.06em;background:var(--surface);color:var(--ink);transition:background-color .35s ease,color .35s ease}
.tab[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}

/* bloom: press shrinks, release opens a little past full size, like a flower opening */
.bl{transition:transform .12s ease}
.bl.bl-down{transform:scale(var(--bl-d,.92))}
.bl.bl-up{animation:blUp .5s cubic-bezier(.3,1.5,.5,1)}
.bl.soft{--bl-d:.97;--bl-u:1.02}
@keyframes blUp{0%{transform:scale(var(--bl-d,.92))}55%{transform:scale(var(--bl-u,1.05))}100%{transform:scale(1)}}
.bloom-once{animation:bloomOnce .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes bloomOnce{0%{transform:scale(.9)}55%{transform:scale(1.06)}100%{transform:scale(1)}}

/* main: flower, phase card, glow */
.stage{position:relative;height:353px;margin-top:7px}
.pcard{position:absolute;left:0;right:0;top:153px;height:200px;border-radius:25px;overflow:hidden;transition:background-color .6s ease}
.glow{position:absolute;left:50%;top:6px;width:290px;height:257px;margin-left:-145px;pointer-events:none;transform:scale(var(--glow-s));transition:opacity .6s ease}
.flower{position:absolute;left:50%;top:0;width:202px;height:203px;margin-left:-101px;border:none;padding:0;background:transparent;color:var(--ink)}
.flower svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.flower svg path{fill:var(--surface);transition:fill .5s ease}
.f-txt{position:absolute;left:0;right:0;text-align:center;line-height:1;white-space:nowrap;letter-spacing:.1em}
.f-phase{top:56px;font-size:20px;font-weight:600;transition:color .5s ease}
.f-day{top:89px;font-size:24px;font-weight:600}
.f-day b{font-size:30px;font-weight:600;margin:0 .22em}
.f-sub{top:130px;font-size:11px;font-weight:400;line-height:18px}
.f-date{top:131px;font-size:12px}
.f-date b{font-size:16px;font-weight:400;margin-right:.05em}
.f-empty{top:94px;font-size:12px;line-height:20px;color:var(--muted)}
.month-en{position:absolute;left:0;right:0;top:56px;margin:0 auto;width:max-content;padding:8px 14px;border:none;background:transparent;font-family:inherit;text-align:center;font-size:26px;font-weight:400;letter-spacing:.04em;color:#fff;line-height:1}

/* week strip: slide to move the day in the middle; tap a day to mark or unmark the period */
.strip{position:absolute;left:0;right:0;top:105px;height:84px;touch-action:pan-y}
.strip-track{position:absolute;inset:0;will-change:transform}
.sday{position:absolute;top:0;width:42px;height:84px;margin-left:-21px;border:none;background:transparent;padding:0;color:#fff;transition:opacity .25s ease}
.sday .wd{position:absolute;left:0;right:0;top:6px;font-size:9px;font-weight:500;letter-spacing:.1em;line-height:1;text-align:center}
.sday .dot-c{position:absolute;left:1px;top:21.6px;width:40px;height:40px;border-radius:50%;box-sizing:border-box;transform:scale(.7);transition:transform .45s cubic-bezier(.3,1.4,.5,1),background-color .45s ease,box-shadow .3s ease}
.sday.sel .dot-c{transform:scale(1)}
.sday .dot-c.pop{animation:markPop .55s cubic-bezier(.3,1.5,.5,1)}
.sday.sel .dot-c.pop{animation-name:markPopSel}
@keyframes markPop{0%{transform:scale(.6)}55%{transform:scale(.78)}100%{transform:scale(.7)}}
@keyframes markPopSel{0%{transform:scale(.86)}55%{transform:scale(1.08)}100%{transform:scale(1)}}
.sday .num{position:absolute;left:0;right:0;top:41.6px;margin-top:-7px;height:14px;line-height:14px;font-size:11px;font-weight:500;letter-spacing:.04em;text-align:center;transition:font-size .35s ease,color .35s ease}
.sday.sel .num{font-size:13px}
.sday .mk{position:absolute;left:50%;top:61px;width:4.9px;height:4.9px;margin-left:-2.45px;border-radius:50%;background:#fff;transition:top .35s ease}
.sday.sel .mk{top:66px}

/* quick record cards: a card splits into its options, and the options fold back the same way */
.qrow{display:flex;justify-content:center;gap:14px;margin-top:-2px}
.qcard{position:relative;width:90px;height:115px;flex-shrink:0}
.qbase{position:absolute;inset:0;border:none;padding:0;border-radius:45px;background:var(--surface);color:var(--ink);transition:background-color .15s ease .55s}
.qcard.open .qbase{background-color:transparent;transition-delay:0s}
.qin{position:absolute;inset:0;transition:opacity .25s ease .45s}
.qcard.open .qin{opacity:0;transition-delay:0s;transition-duration:.18s}
.q-title{position:absolute;left:0;right:0;top:23px;font-size:12px;font-weight:500;letter-spacing:.1em;line-height:14px;text-align:center}
.q-flower{position:absolute;left:50%;top:46px;width:27.4px;height:27.6px;margin-left:-13.7px}
.q-flower svg{width:100%;height:100%;display:block;overflow:visible}
.q-flower path{transition:fill .35s ease}
.q-val{position:absolute;left:0;right:0;top:87px;font-size:9px;letter-spacing:.1em;line-height:12px;text-align:center;color:var(--ink)}
.q-plus{position:absolute;left:50%;top:86.5px;margin-left:-6px;color:var(--ring)}
.qopt{position:absolute;left:0;width:90px;border:none;padding:0;background:var(--surface);color:var(--ink);font-size:12px;font-weight:500;letter-spacing:.1em;
  transition:top .45s cubic-bezier(.3,1.25,.5,1),height .45s cubic-bezier(.3,1.25,.5,1),border-radius .45s ease,background-color .3s ease,color .3s ease,opacity .25s ease}
.qopt span{display:block;transition:opacity .2s ease}
.qopt.shut span{opacity:0}
.flower-open{animation:flowerOpen .7s cubic-bezier(.3,1.5,.5,1)}
@keyframes flowerOpen{0%{transform:scale(.35) rotate(-40deg)}60%{transform:scale(1.18) rotate(6deg)}100%{transform:none}}

/* record page: the phase card grows a white sheet; tap the flower again to fold it */
.sheet{position:relative;margin-top:216.5px;background:var(--surface);border-radius:0 0 22px 22px;padding:3px 0 4px;transition:background-color .5s ease}
.rec-in .stage{animation:stageUp .55s cubic-bezier(.22,.9,.3,1) both}
@keyframes stageUp{from{transform:translateY(32px)}}
.rec-in .sheet{animation:sheetDown .52s cubic-bezier(.22,.9,.3,1) .14s both}
@keyframes sheetDown{from{clip-path:inset(0 0 100% 0 round 0 0 22px 22px)}to{clip-path:inset(0 0 0 0 round 0 0 22px 22px)}}
.rec-in .rrow,.rec-in .rsep{animation:rowIn .4s ease both;animation-delay:calc(.34s + var(--i,0) * .06s)}
@keyframes rowIn{from{opacity:0;transform:translateY(-6px)}}
.rec-in .f-swap{animation:fadeIn .4s ease .16s both}
.rec-out .stage{animation:stageDown .42s cubic-bezier(.4,0,.6,1) both}
@keyframes stageDown{to{transform:translateY(32px)}}
.rec-out .sheet{animation:sheetUp .34s cubic-bezier(.4,0,.8,.6) both}
@keyframes sheetUp{from{clip-path:inset(0 0 0 0 round 0 0 22px 22px)}to{clip-path:inset(0 0 100% 0 round 0 0 22px 22px)}}
.m-leave .tabs,.m-leave .qrow{transition:opacity .2s ease,transform .2s ease;opacity:0}
.m-leave .qrow{transform:translateY(8px)}
.m-leave .flower{animation:bloomOnce .35s cubic-bezier(.3,1.5,.5,1)}
.from-rec .tabs,.from-rec .qrow,.from-rec .month-en,.from-rec .strip{animation:fadeIn .4s ease .05s both}

/* record rows (record page and the day card under the month calendar) */
.rrow{position:relative;min-height:60px;box-sizing:border-box;padding:0 30px;display:flex;align-items:center;gap:0}
.rsep{height:1.05px;margin:0 31px;background:var(--track)}
.rlabel{width:86.6px;flex-shrink:0;border:none;background:transparent;padding:0;text-align:left;font-size:14px;font-weight:600;letter-spacing:.1em;height:60px;color:var(--ink)}
.rval{flex:1;min-width:0;border:none;background:transparent;padding:0;height:60px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;color:var(--ink)}
.rval:disabled{opacity:.45}
.rtext{font-size:11px;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ricon{width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--ring);margin-right:-3px}
.ricon svg{overflow:visible}
.pills{flex:1;display:flex;gap:6px;align-items:center}
.rpill{height:32px;min-width:54px;padding:0 12px;border:none;border-radius:16px;background:var(--track);color:var(--ink);font-size:12px;font-weight:500;letter-spacing:.1em;
  animation:petal .45s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--i,0) * .06s);transition:background-color .3s ease,color .3s ease}
.rpill.on{color:#fff}
@keyframes petal{from{opacity:0;transform:translateX(18px) scale(.6)}}
.rnote{width:100%;box-sizing:border-box;border:none;outline:none!important;resize:none;background:var(--track);border-radius:14px;padding:10px 12px;font-family:var(--f-ui);font-size:13px;letter-spacing:.06em;line-height:1.6;color:var(--ink)}
.rrow.noteopen{flex-direction:column;align-items:stretch;padding-bottom:16px}
.rrow.noteopen .rlabel{height:52px}

/* month: same calendar as Slow Growing; the dot sits inside the circle, halfway between the number and the edge */
.calcard{background:var(--surface);border-radius:24px;padding:12px 14px 20px;transition:background-color .5s ease;touch-action:pan-y;overflow:hidden}
.cal-head{display:flex;align-items:center;justify-content:space-between}
.arrow{width:44px;height:44px;border:none;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;color:var(--ring)}
.arrow:disabled{opacity:.35}
.titlebtn{border:none;background:transparent;color:inherit;font-family:inherit;padding:0 8px;min-height:32px;cursor:pointer}
.cal-title{font-size:14px;font-weight:600;letter-spacing:.1em}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:8px;justify-items:center}
.cal-l{font-size:11px;font-weight:500;color:var(--muted);padding-top:6px;line-height:1}
.cal-labels{margin-bottom:12px}
.cday{position:relative;width:38px;height:38px;box-sizing:border-box;border-radius:50%;border:1.5px solid transparent;padding:0;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:500;color:var(--ink);background:transparent;transition:background-color .45s ease,border-color .3s ease,color .35s ease}
.cday.today{border-color:var(--ring)}
.cday.sel{border-color:var(--ink)}
.cday .mk{position:absolute;left:50%;top:28.8px;width:4.2px;height:4.2px;margin:-1.5px 0 0 -2.1px;border-radius:50%;box-sizing:border-box}
.cday.pop{animation:bloomOnce .55s cubic-bezier(.3,1.5,.5,1)}
.daycard{background:var(--surface);border-radius:22px;padding:6px 0 4px;transition:background-color .5s ease}
.day-title{text-align:center;font-size:14px;font-weight:600;letter-spacing:.1em;padding:20px 0 12px}
.future{padding:8px 24px 30px;text-align:center;font-size:12px;letter-spacing:.1em;line-height:1.8;color:var(--muted)}

/* year */
.ysum{position:relative;height:131px;margin-top:15px}
.ysum .circ{position:absolute;left:50%;top:0;width:130px;height:130px;margin-left:-10.3px;border-radius:50%;background:var(--surface);transition:background-color .5s ease}
.ysum .yfl{position:absolute;left:50%;top:2.8px;width:126px;height:126.6px;margin-left:-119.7px}
.ysum .yfl svg{width:100%;height:100%;display:block;overflow:visible}
.ysum .yv{position:absolute;width:130px;text-align:center;line-height:1}
.yv .n{font-size:24px;font-weight:600;letter-spacing:.1em}
.yv .u{font-size:22px;font-weight:600;letter-spacing:.1em}
.yv .l{display:block;margin-top:9px;font-size:11px;font-weight:500;letter-spacing:.1em}
.ynav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:4px 8px -4px}
.ynum{font-size:20px;font-weight:600;letter-spacing:.06em;text-align:center}
.ylist{display:flex;flex-direction:column;gap:16px}
.ycard{width:100%;border:none;text-align:left;color:var(--ink);font-family:inherit;background:var(--surface);border-radius:19.33px;min-height:90px;box-sizing:border-box;padding:22px 24px 21px 32px;display:flex;flex-direction:column;justify-content:center;gap:10px;transition:background-color .5s ease}
.y1{display:flex;align-items:baseline;gap:10px;line-height:1;flex-wrap:wrap}
.y1 .big{font-size:18px;font-weight:600;letter-spacing:.1em}
.y1 .bigu{font-size:16px;font-weight:600;letter-spacing:.1em}
.y1 .rng{font-size:12px;font-weight:600;letter-spacing:.1em}
.y2{font-size:11px;font-weight:500;letter-spacing:.1em;line-height:1.5}
.y2 .p{color:var(--brand)}
.y2 .g,.y3{color:var(--ring)}
.y3{font-size:11px;font-weight:500;letter-spacing:.1em;line-height:1.5;margin-top:-6px}

/* settings */
.setlist{display:flex;flex-direction:column;gap:16px}
.setrow{width:100%;min-height:70px;box-sizing:border-box;padding:16px 20px 16px 19.5px;border:none;border-radius:18px;background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:flex-start;gap:14.5px;text-align:left;transition:background-color .5s ease}
.setrow.noicon{padding-left:21px}
.set-title{font-size:14px;font-weight:600;letter-spacing:.1em}
.set-sub{display:block;font-size:9px;font-weight:400;letter-spacing:.1em;margin-top:5px;font-variant-numeric:tabular-nums}
.set-sub.warn{color:var(--danger)}
.set-icon{display:flex;width:32px;height:32px;flex-shrink:0;align-items:center;justify-content:center}
.set-icon svg{overflow:visible}
.thanks{margin:24px 0 0;text-align:center;font-size:12px;letter-spacing:.1em;display:flex;align-items:center;justify-content:center;gap:8px}
.thanks svg{width:14px;height:12px}
.cyc-auto{justify-content:space-between;padding-left:27px;padding-right:24px}
.chkc{width:26px;height:26px;border-radius:50%;box-sizing:border-box;border:1.3px solid var(--ring);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background-color .3s ease,border-color .3s ease}
.chkc.on{background:var(--brand);border-color:var(--brand);color:#fff}
.cyc-sub{margin:-6px 0 0;text-align:center;font-size:11px;letter-spacing:.1em;line-height:1.7;color:var(--muted)}
.sec-title{text-align:center;font-size:16px;font-weight:600;letter-spacing:.1em;margin-top:12px}
.steprow{min-height:66px;box-sizing:border-box;padding:0 16.7px 0 27px;border-radius:16px;background:var(--surface);display:flex;align-items:center;justify-content:space-between;transition:background-color .5s ease}
.steprow .set-title{white-space:nowrap}
.stepper{display:flex;align-items:center}
.step{width:44px;height:44px;border:none;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.step span.c{width:26px;height:26px;border-radius:50%;background:var(--track);display:flex;align-items:center;justify-content:center}
.step:disabled{opacity:.35}
.step-n{width:48px;text-align:center;font-family:var(--f-num);font-size:18px;letter-spacing:.06em;font-variant-numeric:tabular-nums;transition:opacity .3s ease}
.dim{opacity:.4}
.disclaim{margin:22px 12px 0;text-align:center;font-size:11px;letter-spacing:.1em;line-height:1.8;color:var(--muted)}

/* misc */
.empty{padding:40px 12px;text-align:center;font-size:13px;letter-spacing:.1em;line-height:1.9;color:var(--muted)}
.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:32px;z-index:10}
.dialog{width:100%;max-width:340px;background:var(--surface);border-radius:24px;padding:28px 22px 20px;display:flex;flex-direction:column;gap:10px;text-align:center}
.dlg-title{font-size:16px;font-weight:600;letter-spacing:.1em}
.dlg-text{font-size:13px;line-height:1.7;letter-spacing:.1em;color:var(--muted)}
.dlg-btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.pill{height:48px;border:none;border-radius:999px;font-size:14px;font-weight:600;letter-spacing:.1em;background:var(--track);color:var(--ink)}
.pill.primary{background:var(--brand);color:var(--on-brand)}
.pill.danger{background:var(--danger);color:#ffffff}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:13px;letter-spacing:.1em;z-index:20;white-space:nowrap}

/* logo eyes */
.eyes-look{animation:look 12s ease-in-out infinite}
.eyes-blink{transform-box:fill-box;transform-origin:center;animation:blink 6s ease-in-out infinite}
@keyframes look{0%,16%{transform:translate(0,0)}23%,37%{transform:translate(-2.6px,0)}44%,55%{transform:translate(0,0)}62%,73%{transform:translate(2.2px,-1px)}80%,100%{transform:translate(0,0)}}
@keyframes blink{0%,40%,46%,100%{transform:scaleY(1)}43%{transform:scaleY(.12)}}

/* page + slide motion */
.in-r{animation:inR .55s cubic-bezier(.22,.9,.32,1)}
.in-l{animation:inL .55s cubic-bezier(.22,.9,.32,1)}
@keyframes inR{from{transform:translateX(44px);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-44px);opacity:0}to{transform:none;opacity:1}}
.fade-in{animation:fadeIn .35s ease}
.pop-in{animation:popIn .5s cubic-bezier(.3,1.35,.5,1)}
@keyframes fadeIn{from{opacity:0}}
@keyframes popIn{from{transform:scale(.9);opacity:0}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

  P.forEach(p => { if (p.e < d) prev = p; else if (p.s > d && !nxt) nxt = p; });
  if (prev && diffD(prev.e, d) <= 2) return P.map(p => p === prev ? { s: p.s, e: d } : p);
  // a day up to one period-length before the next period becomes its first day;
  // the length is counted again from there, keeping days already past and days with a recorded flow
  if (nxt && diffD(d, nxt.s) <= plen) {
    let e = addD(d, plen - 1);
    const kept = nxt.e < today ? nxt.e : today;
    if (kept > e) e = kept;
    for (let x = nxt.s; x <= nxt.e; x = addD(x, 1)) if (logs && logs[x] && logs[x].flow && x > e) e = x;
    if (e > nxt.e) e = nxt.e;
    return sortP(P.map(p => p === nxt ? { s: d, e } : p));
  }
  let e = addD(d, plen - 1);
  if (nxt && e >= nxt.s) e = addD(nxt.s, -1);

}
// tapping a day (like the Health app):

}
function useStore(today) {

  useEffect(() => { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {} }, []);
  const model = useMemo(() => buildModel(data, today), [data, today]);
  const setLog = (d, fn) => setData(s => {
    const logs = Object.assign({}, s.logs);
    const l = cleanLog(fn(Object.assign({}, logs[d] || {})));

    return Object.assign({}, s, { logs });

  return {
    data, model,
    setItem: (d, k, v) => {

    planMark: d => planMark(data, d, model.plen, today),
    applyMark: plan => setData(s => Object.assign({}, s, { periods: plan.periods, logs: plan.logs })),
    setNote: (d, text) => setLog(d, l => { l.note = text; return l; }),
    setSettings: o => setData(s => Object.assign({}, s, { settings: Object.assign({}, s.settings, o) })),

    restore: b => setData(s => ({ v: 1, theme: b.theme == null ? s.theme : b.theme, lastBackup: s.lastBackup, periods: sortP(b.periods || []), logs: b.logs || {}, settings: Object.assign({}, DEFAULT_SETTINGS, b.settings || {}) }))

const isDay = s => typeof s === 'string' && /^\d{4}-\d\d-\d\d$/.test(s);

  if (!b.periods.every(p => p && isDay(p.s) && isDay(p.e) && p.s <= p.e)) throw new Error('bad periods');

/* ---------- bloom feedback for anything marked .bl ---------- */
(function () {
  let cur = null;
  document.addEventListener('pointerdown', e => {
    const el = e.target && e.target.closest && e.target.closest('.bl');
    if (!el || el.disabled) return;
    cur = { el, x: e.clientX, y: e.clientY };
    el.classList.remove('bl-up'); el.classList.add('bl-down');
  }, true);
  document.addEventListener('pointermove', e => {
    if (cur && (Math.abs(e.clientX - cur.x) > 9 || Math.abs(e.clientY - cur.y) > 9)) { cur.el.classList.remove('bl-down'); cur = null; }
  }, true);
  const up = () => {
    if (!cur) return;
    const el = cur.el; cur = null;
    el.classList.remove('bl-down'); void el.offsetWidth; el.classList.add('bl-up');
  };
  document.addEventListener('pointerup', up, true);
  document.addEventListener('pointercancel', () => { if (cur) { cur.el.classList.remove('bl-down'); cur = null; } }, true);
  document.addEventListener('animationend', e => { if (e.animationName === 'blUp' && e.target.classList) e.target.classList.remove('bl-up'); }, true);
})();

/* ---------- main: week strip ---------- */
// slide to move the day in the middle (the flower, the card and the quick cards show that day);
// tap any day to mark or unmark the period there, in place
const STEP = 42.5;
function stripLook(info, cardPhase) {
  if (!info) return null;
  if (info.per === 'act') return { bg: '#ffffff', fg: '#323232' };
  if (info.per === 'pred') return { bg: 'rgba(255,255,255,.3)', fg: '#ffffff' };
  if (info.ovu) return { bg: cardPhase === 'ovu' ? OV_DEEP : OV_SOFT, fg: '#ffffff' };
  return null;
}
function WeekStrip({ m, sel, setSel, today, cardPhase, onMark, pop }) {
  const [off, setOff] = useState(0);
  const [anim, setAnim] = useState(false);
  const g = useRef(null);
  const tapBlock = useRef(0);
  // start from where the days are now and glide into place
  const slide = (startOff, to) => {
    setAnim(false); setOff(startOff);
    if (to !== sel) setSel(to);
    requestAnimationFrame(() => requestAnimationFrame(() => { setAnim(true); setOff(0); }));
  };
  const down = e => { g.current = { x0: e.clientX, y0: e.clientY, on: false, dx: 0 }; };
  const move = e => {
    const s = g.current; if (!s) return;
    const dx = e.clientX - s.x0, dy = e.clientY - s.y0;
    if (!s.on) {
      if (Math.abs(dx) > 7 && Math.abs(dx) > Math.abs(dy)) { s.on = true; try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {} }
      else { if (Math.abs(dy) > 10) g.current = null; return; }
    }
    s.dx = dx; setAnim(false); setOff(dx);
  };
  const up = () => {
    const s = g.current; g.current = null;
    if (!s || !s.on) return;
    tapBlock.current = Date.now();
    let k = Math.round(-s.dx / STEP);
    if (!k && Math.abs(s.dx) > 18) k = s.dx < 0 ? 1 : -1;
    slide(s.dx + k * STEP, addD(sel, k));
  };
  const goToday = () => {
    const k = diffD(sel, today); if (!k) return;
    slide(Math.max(-6, Math.min(6, k)) * STEP, today);
  };
  const cells = [];
  for (let i = -5; i <= 5; i++) {
    const d = addD(sel, i);
    const info = dayInfo(m, d);
    const look = stripLook(info, cardPhase);
    const isSel = i === 0, isT = d === today;
    const ring = isSel ? (look ? null : 'inset 0 0 0 1.5px #ffffff') : isT ? (look ? '0 0 0 2px ' + PH[cardPhase].color + ', 0 0 0 3.3px #ffffff' : 'inset 0 0 0 1.4px #ffffff') : null;
    const fade = Math.max(0, Math.min(1, (4 * STEP - Math.abs(i * STEP + off)) / STEP));
    const popped = pop && pop.d === d;
    cells.push(html`<button key=${d} className=${'sday' + (isSel ? ' sel' : '')} tabIndex=${Math.abs(i) > 3 ? -1 : 0} style=${{ left: 'calc(50% + ' + (i * STEP) + 'px)', opacity: fade }}
      aria-label=${mdZh(d) + (isT ? '，今天' : '') + (info && info.per === 'act' ? '，經期' : '') + '，點一下標記或取消經期'}
      onClick=${() => { if (Date.now() - tapBlock.current < 300) return; onMark(d); }}>
      <span className="wd">${DOW[parseYmd(d).getDay()]}</span>
      <span key=${popped ? 'p' + pop.n : 'c'} className=${'dot-c' + (popped ? ' pop' : '')} style=${{ background: look ? look.bg : 'transparent', boxShadow: ring || 'none' }}></span>
      <span className="num" style=${{ color: look ? look.fg : '#ffffff' }}>${+d.slice(8)}</span>
      ${m.logs[d] && html`<span className="mk" style=${m.logs[d].flow || m.logs[d].spot || m.logs[d].mucus ? null : { background: 'transparent', boxShadow: 'inset 0 0 0 1.1px #fff' }}></span>`}
    </button>`);
  }
  return html`<${React.Fragment}>
    <button key=${sel.slice(0, 7)} className="month-en fade-in bl" aria-label="回到今天" onClick=${goToday}>${MONTH_EN[+sel.slice(5, 7) - 1]}</button>
    <div className="strip" onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${up}>
      <div className="strip-track" style=${{ transform: 'translateX(' + off + 'px)', transition: anim ? 'transform .48s cubic-bezier(.25,1.12,.4,1)' : 'none' }}>${cells}</div>
    </div>
  </${React.Fragment}>`;
}

/* ---------- main: quick record cards ---------- */
// opening: the white card becomes the first option and the others slide out one by one;
// closing plays the same thing backwards, then the card's flower opens in its colour
const OPT_GEO = { 2: [[9.5, 44], [61.5, 44]], 3: [[5, 35], [40, 35], [75, 35]] };
function QuickCard({ item, value, open, onOpen, onClose, onPick, disabled, bloomKey }) {
  const [stage, setStage] = useState('none');   // none → shut → open → back → fade → none
  useEffect(() => {
    if (open) {
      setStage('shut');
      const r = requestAnimationFrame(() => requestAnimationFrame(() => setStage('open')));
      return () => cancelAnimationFrame(r);
    }
    if (stage === 'none') return;
    setStage('back');
    const t1 = setTimeout(() => setStage('fade'), 480);
    const t2 = setTimeout(() => setStage('none'), 760);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, [open]);
  const geo = OPT_GEO[item.opts.length];
  const n = item.opts.length;
  return html`<div className=${'qcard' + (open ? ' open' : '')} data-k=${item.k}>
    <button className="qbase bl" aria-label=${item.label + '：' + (value ? item.opts[value - 1] : '還沒記錄') + '，點一下記錄'} aria-expanded=${open ? 'true' : 'false'}
      style=${{ opacity: disabled ? .45 : 1 }} onClick=${() => open ? onClose() : onOpen()}>
      <span className="qin">
        <span className="q-title">${item.label}</span>
        <span key=${'f' + bloomKey} className="q-flower"><${Bud} color=${value ? item.color : 'var(--bud)'} size=${27.4} open=${bloomKey > 0 && !!value} /></span>
        ${value ? html`<span className="q-val">${item.opts[value - 1]}</span>` : html`<span className="q-plus"><${Icon} name="plusSm" /></span>`}
      </span>
    </button>
    ${stage !== 'none' && item.opts.map((o, i) => {
      const on = value === i + 1;
      let st;
      if (stage === 'open') st = { top: geo[i][0] + 'px', height: geo[i][1] + 'px', borderRadius: geo[i][1] / 2 + 'px', transitionDelay: (i * 0.06) + 's' };
      else if (stage === 'shut') st = { top: '0px', height: '115px', borderRadius: '45px', opacity: i === 0 ? 1 : 0, transitionDuration: '0s' };
      else st = { top: '0px', height: '115px', borderRadius: '45px', opacity: stage === 'fade' ? 0 : 1, transitionDelay: stage === 'fade' ? '0s' : ((n - 1 - i) * 0.06) + 's' };
      return html`<button key=${o} className=${'qopt bl' + (stage === 'open' ? '' : ' shut')} aria-pressed=${on ? 'true' : 'false'} tabIndex=${stage === 'open' ? 0 : -1}
        style=${Object.assign(st, { background: on && stage === 'open' ? item.color : 'var(--surface)', color: on && stage === 'open' ? '#fff' : 'var(--ink)', zIndex: n - i, pointerEvents: stage === 'open' ? 'auto' : 'none' })}
        onClick=${() => onPick(on ? null : i + 1)}><span>${o}</span></button>`;
    })}
  </div>`;
}

  const phase = info ? info.phase : 'men';
  return html`<div className=${'screen ' + (leaving ? 'rec-out' : 'rec-in')}>
    <${Header} toggleTheme=${toggleTheme} right=${html`<button className="iconbtn" aria-hidden="true" tabIndex="-1" style=${{ pointerEvents: 'none' }}><${Icon} name="menu" /></button>`} />
    <div style=${{ height: '8px' }}></div>
    <div className="stage" style=${{ height: 'auto' }}>
      <div className="pcard" style=${{ background: cardBg(PH[phase].color) }}></div>
      <div className="sheet">
        <${RecordRows} store=${store} date=${date} showToast=${showToast} />
      </div>
      <${Glows} phase=${phase} />
      <button className="flower bl soft" aria-label=${mdZh(date) + '，點一下收起記錄頁'} onClick=${onDone}>
        <svg viewBox="86.5 191.9 202 203" aria-hidden="true"><path d=${P_BIG} /></svg>
        <${FlowerText} m=${m} info=${info} date=${date} mode="rec" />
      </button>
    </div>
  </div>`;
}

/* ---------- month ---------- */
function Month({ store, today, toggleTheme, openSettings, view, setView, mOff, shiftMonth, jumpMonth, mSel, setMSel, calAnim, showToast, markDay, pop }) {
  const m = store.model;
  const base = parseYmd(today.slice(0, 8) + '01'); base.setMonth(base.getMonth() + mOff);
  const y = base.getFullYear(), mo = base.getMonth();
  const dim = new Date(y, mo + 1, 0).getDate();
  const lead = new Date(y, mo, 1).getDay();
  const sw = useRef(null);
  const swDown = e => { sw.current = { x: e.clientX, y: e.clientY }; };
  const swUp = e => {
    const s = sw.current; sw.current = null; if (!s) return;
    const dx = e.clientX - s.x, dy = e.clientY - s.y;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) shiftMonth(dx > 0 ? -1 : 1);
  };
  const days = [];
  for (let i = 0; i < lead; i++) days.push(html`<div key=${'b' + i}></div>`);
  for (let dd = 1; dd <= dim; dd++) {
    const d = y + '-' + pad(mo + 1) + '-' + pad(dd);
    const info = dayInfo(m, d);
    const l = m.logs[d];
    let bg = 'transparent', fg = 'var(--ink)';
    const solid = info && info.per === 'act';
    if (solid) { bg = PINK; fg = '#fff'; }
    else if (info && info.per === 'pred') bg = hexA(PINK, .3);
    else if (info && info.ovu) bg = hexA(YELLOW, .3);
    // one dot per day: other bleeding first, then flow, then discharge; a note alone gets an outline dot; white on a solid pink day
    let dot = null;
    if (l) {
      const c = l.spot ? YELLOW : l.flow ? PINK : l.mucus ? '#adaca5' : null;
      dot = c ? { background: solid ? '#fff' : c } : { border: '1.1px solid ' + (solid ? '#fff' : '#adaca5') };
    }
    const isSel = d === mSel, isT = d === today;
    const popped = pop && pop.d === d;
    days.push(html`<button key=${d + (popped ? pop.n : '')} className=${'cday' + (isSel ? ' sel' : '') + (isT && !isSel ? ' today' : '') + (popped ? ' pop' : '')}
      style=${{ background: bg, color: fg }} aria-label=${mdZh(d) + (isT ? '，今天' : '') + (isSel ? '，選取中，再點一下標記或取消經期' : '')} aria-pressed=${isSel ? 'true' : 'false'}
      onClick=${() => isSel ? markDay(d) : setMSel(d)}>${dd}${dot && html`<span className="mk" style=${dot}></span>`}</button>`);
  }
  const selInfo = dayInfo(m, mSel);
  let futureText = '這天還沒到，還不能記錄哦';
  if (selInfo && selInfo.per === 'pred') futureText = '預計經期第 ' + selInfo.day + ' 天';
  else if (selInfo && selInfo.ovu) futureText = '預計是排卵期';
  return html`<div className="screen">
    <${Header} toggleTheme=${toggleTheme} right=${html`<button className="iconbtn bl" aria-label="打開設定" onClick=${openSettings}><${Icon} name="menu" /></button>`} />
    <nav className="tabs">
      ${VIEWS.map((v, i) => html`<button key=${v} className="tab bl" aria-pressed=${view === v ? 'true' : 'false'} onClick=${() => setView(v)}>${['Main', 'Month', 'Year'][i]}</button>`)}
    </nav>
    <section className="calcard" onPointerDown=${swDown} onPointerUp=${swUp}>
      <div className="cal-head">
        <button className="arrow bl" aria-label="上個月" onClick=${() => shiftMonth(-1)}><${Icon} name="left" /></button>
        <button key=${'t' + mOff} className=${'cal-title titlebtn ' + calAnim} aria-label="回到本月" onClick=${jumpMonth}>${y}年 ${mo + 1}月</button>
        <button className="arrow bl" aria-label="下個月" disabled=${mOff >= 12} onClick=${() => shiftMonth(1)}><${Icon} name="right" /></button>
      </div>
      <div key=${'g' + mOff} className=${calAnim}>
        <div className="cal-grid cal-labels">${DOW.map(lb => html`<div key=${lb} className="cal-l">${lb}</div>`)}</div>
        <div className="cal-grid">${days}</div>
      </div>
    </section>
    <section className="daycard" style=${{ marginTop: '-4px' }}>
      <div key=${mSel} className="day-title fade-in">${mSel.slice(0, 4)}年 ${+mSel.slice(5, 7)}月 ${+mSel.slice(8)}日</div>
      ${mSel > today
        ? html`<div className="future">${futureText}</div>`
        : html`<${RecordRows} store=${store} date=${mSel} showToast=${showToast} />`}
    </section>
  </div>`;
}

/* ---------- year ---------- */
function Year({ store, today, toggleTheme, openSettings, view, setView, year, setYear, calAnim, openCycleMonth }) {
  const m = store.model;
  const firstYear = m.periods.length ? +m.periods[0].s.slice(0, 4) : +today.slice(0, 4);
  const thisYear = +today.slice(0, 4);
  const rows = cycleRows(m, year);
  const avgP = m.avgPeriod != null ? Math.round(m.avgPeriod) : null;
  const avgC = m.avgCycle != null ? Math.round(m.avgCycle) : null;
  const spotText = r => {
    const parts = ['early', 'mid', 'late'].filter(k => r.cls[k]).map(k => CLASS_ZH[k] + ' ' + r.cls[k] + ' 天');
    return parts.join('・');
  };
  return html`<div className="screen">
    <${Header} toggleTheme=${toggleTheme} right=${html`<button className="iconbtn bl" aria-label="打開設定" onClick=${openSettings}><${Icon} name="menu" /></button>`} />
    <nav className="tabs">
      ${VIEWS.map((v, i) => html`<button key=${v} className="tab bl" aria-pressed=${view === v ? 'true' : 'false'} onClick=${() => setView(v)}>${['Main', 'Month', 'Year'][i]}</button>`)}
    </nav>
    <div className="ysum" aria-label=${'平均經期 ' + (avgP || '—') + ' 天，平均週期 ' + (avgC || '—') + ' 天'}>
      <div className="circ"></div>
      <div className="yv" style=${{ left: 'calc(50% - 10.3px)', top: '44px' }}>
        <span className="n" style=${{ color: PINK }}>${avgC || '—'}</span><span className="u" style=${{ color: PINK }}>天</span>
        <span className="l">平均週期</span>
      </div>
      <div className="yfl" dangerouslySetInnerHTML=${{ __html: '<svg viewBox="67.8 203.34 126 126.61"><path fill="' + PINK + '" d="' + P_YEAR + '"/></svg>' }}></div>
      <div className="yv" style=${{ left: 'calc(50% - 121.7px)', top: '44px', color: '#fff' }}>
        <span className="n">${avgP || '—'}</span><span className="u">天</span>
        <span className="l">平均經期</span>
      </div>
    </div>
    <div className="ynav">
      <button className="arrow bl" aria-label="前一年" disabled=${year <= firstYear} style=${{ opacity: year <= firstYear ? .35 : 1 }} onClick=${() => setYear(year - 1)}><${Icon} name="left" /></button>
      <div key=${year} className=${'ynum ' + calAnim}>${year}</div>
      <button className="arrow bl" aria-label="後一年" disabled=${year >= thisYear} style=${{ opacity: year >= thisYear ? .35 : 1 }} onClick=${() => setYear(year + 1)}><${Icon} name="right" /></button>
    </div>
    <div key=${'l' + year} className=${'ylist ' + calAnim}>
      ${rows.length === 0 && html`<div className="empty">這一年還沒有紀錄哦</div>`}
      ${rows.map(r => html`<button key=${r.p.s} className="ycard bl soft" aria-label=${'在月曆看 ' + mdZh(r.p.s) + ' 開始的週期'} onClick=${() => openCycleMonth(r.p.s)}>
        ${r.current
          ? html`<div className="y1"><span className="bigu">目前週期</span><span className="rng">開始於${mdZh(r.p.s)}</span></div>`
          : r.gapped
          ? html`<div className="y1"><span className="bigu">${mdZh(r.p.s)}開始</span><span className="rng">之後還沒有紀錄</span></div>`
          : html`<div className="y1"><span><span className="big">${r.cycleLen}</span><span className="bigu">天</span></span><span className="rng">${mdZh(r.p.s)}－${mdZh(r.end)}</span></div>`}
        <div className="y2">
          <span className="p">${r.ongoing ? '經期第 ' + r.perLen + ' 天' : '經期 ' + r.perLen + ' 天'}</span>
          ${r.current && !r.ongoing && html`<span className="g">・週期第 ${r.cycleDay} 天</span>`}
          ${r.spots > 0 && html`<span className="g">・其他出血 ${r.spots} 天</span>`}
        </div>
        ${r.spots > 0 && html`<div className="y3">${spotText(r)}</div>`}
      </button>`)}
    </div>
  </div>`;
}

/* ---------- settings ---------- */
function Settings({ store, onClose, onBackup, onPickRestore, toggleTheme, openCycle }) {
  const last = store.data.lastBackup;
  const stale = !last || (Date.now() - new Date(last).getTime()) > 14 * 864e5;
  return html`<div className="screen tight">
    <${Header} toggleTheme=${toggleTheme} right=${html`<button className="iconbtn bl" aria-label="關閉設定" onClick=${onClose}><${Icon} name="close" /></button>`} />
    <div className="setlist" style=${{ marginTop: '10px' }}>
      <button className="setrow bl soft" onClick=${onBackup}>
        <span className="set-icon" style=${{ color: stale ? 'var(--danger)' : 'var(--brand)' }}><${Icon} name=${stale ? 'cloudUp' : 'cloudOk'} /></span>
        <span><span className="set-title">備份檔案</span><span className=${'set-sub' + (stale ? ' warn' : '')}>${last ? fmtDate(last) : '還沒備份過'}</span></span>
      </button>
      <button className="setrow bl soft" onClick=${onPickRestore}>
        <span className="set-icon" style=${{ color: 'var(--brand)' }}><${Icon} name="restore" /></span>
        <span><span className="set-title">從備份還原</span><span className="set-sub">選擇之前存的備份檔</span></span>
      </button>
      <button className="setrow bl soft" onClick=${openCycle}>
        <span className="set-icon" style=${{ color: 'var(--brand)' }}><${Icon} name="flowerLine" /></span>
        <span className="set-title">我的生理週期</span>
      </button>
      <div className="setrow noicon"><span className="set-title">版本維護 Version ${VERSION.label}</span></div>
    </div>
    <p className="thanks">特別感謝 <span style=${{ display: 'flex' }} dangerouslySetInnerHTML=${{ __html: '<svg viewBox="157.7 477.05 13.6 11.58"><path fill="' + PINK + '" d="' + P_HEART + '"/></svg>' }}></span> 我的Claude阿澈</p>
  </div>`;
}
function CycleSettings({ store, onClose, toggleTheme }) {
  const m = store.model;
  const st = store.data.settings || DEFAULT_SETTINGS;
  const auto = st.mode !== 'manual';
  const cur = { period: m.plen, cycle: m.cycle };
  const n = Math.min(m.recentC.length, 6);
  const enough = m.recentC.length > 0;
  const bump = (k, dir) => {
    const r = k === 'period' ? PERIOD_RANGE : CYCLE_RANGE;
    const v = Math.max(r[0], Math.min(r[1], cur[k] + dir));
    store.setSettings(Object.assign({ mode: 'manual', period: cur.period, cycle: cur.cycle }, { [k]: v }));
  };
  const stepper = (k, label) => {
    const r = k === 'period' ? PERIOD_RANGE : CYCLE_RANGE;
    return html`<div className="steprow">
      <span className="set-title">${label}</span>
      <div className="stepper">
        <button className="step bl" aria-label=${label + '減少'} disabled=${cur[k] <= r[0]} onClick=${() => bump(k, -1)}><span className="c"><${Icon} name="minus" /></span></button>
        <div className=${'step-n' + (auto ? ' dim' : '')} aria-live="polite">${cur[k]}</div>
        <button className="step bl" aria-label=${label + '增加'} disabled=${cur[k] >= r[1]} onClick=${() => bump(k, 1)}><span className="c"><${Icon} name="plusSm" /></span></button>
      </div>
    </div>`;
  };
  return html`<div className="screen tight">
    <${Header} toggleTheme=${toggleTheme} right=${html`<button className="iconbtn bl" aria-label="回到設定" onClick=${onClose}><${Icon} name="close" /></button>`} />
    <button className="setrow cyc-auto bl soft" style=${{ marginTop: '10px' }} aria-pressed=${auto ? 'true' : 'false'}
      onClick=${() => store.setSettings(auto ? { mode: 'manual', period: cur.period, cycle: cur.cycle } : { mode: 'auto' })}>
      <span className="set-title">依紀錄自動計算</span>
      <span className=${'chkc' + (auto ? ' on' : '')}>${auto && html`<${Icon} name="tick" />`}</span>
    </button>
    <p className="cyc-sub">${auto
      ? (enough ? html`目前平均：經期 ${m.plen} 天、週期 ${m.cycle} 天<br />依最近 ${n} 次週期計算` : html`紀錄還不夠，先用預設值<br />記下兩次經期後就會自動計算`)
      : '目前使用手動設定，只會影響預測，不會改到統計'}</p>
    <div className="sec-title">手動設定</div>
    ${stepper('period', '經期天數')}
    ${stepper('cycle', '週期天數')}
    <p className="disclaim">預測根據過去紀錄推估<br />不能當避孕或醫療判斷依據</p>
  </div>`;
}

/* ---------- app ---------- */
function App() {
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);
  const showToast = msg => { setToast(msg); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToast(null), 2600); };
  const today = useToday();
  const store = useStore(today);
  const fileRef = useRef(null);
  const [pendingRestore, setPendingRestore] = useState(null);
  const [confirmMark, setConfirmMark] = useState(null);
  const [pop, setPop] = useState(null);

  const [view, setViewState] = useState(() => { const v = uiGet().view; return VIEWS.indexOf(v) >= 0 ? v : 'main'; });
  const [page, setPage] = useState({ name: 'home', anim: '' });
  const [sel, setSel] = useState(today);
  const [mOff, setMOff] = useState(0);
  const [mSel, setMSel] = useState(today);
  const [calAnim, setCalAnim] = useState('');
  const [year, setYearState] = useState(+today.slice(0, 4));
  const [leaving, setLeaving] = useState(false);
  const busy = useRef(false);

  // a new day: the main page follows today again
  const lastToday = useRef(today);
  useEffect(() => {
    if (lastToday.current === today) return;
    if (sel === lastToday.current) setSel(today);
    if (mSel === lastToday.current) setMSel(today);
    lastToday.current = today;
  }, [today]);

  const firstTheme = useRef(true);
  useEffect(() => {
    const root = document.documentElement;
    const t = store.data.theme;
    if (!firstTheme.current) {
      root.classList.add('theming');
      clearTimeout(root._themeTimer);
      root._themeTimer = setTimeout(() => root.classList.remove('theming'), 650);
    }
    firstTheme.current = false;
    if (t === 'dark' || t === 'light') root.setAttribute('data-app', t); else root.removeAttribute('data-app');
    const sync = () => {
      const bg = getComputedStyle(root).getPropertyValue('--bg').trim();
      const mt = document.getElementById('theme-color'); if (mt && bg) mt.setAttribute('content', bg);
    };
    sync();
    const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    // the phone switching light/dark by itself gets the same smooth change
    const onSys = () => { root.classList.add('theming'); clearTimeout(root._themeTimer); root._themeTimer = setTimeout(() => root.classList.remove('theming'), 650); sync(); };
    if (mq && mq.addEventListener) { mq.addEventListener('change', onSys); return () => mq.removeEventListener('change', onSys); }
  }, [store.data.theme]);

  const doBackup = async () => {
    const snap = store.snapshot();
    const name = 'blossom-backup-' + ymd(new Date()) + '.json';
    const text = JSON.stringify(snap, null, 2);
    let file = null;
    try { file = new File([text], name, { type: 'application/json' }); } catch (e) {}
    try {
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
        store.markBackup(); showToast('備份好了');
        return;
      }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try {
      const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      store.markBackup(); showToast('備份檔已下載');
    } catch (e) { showToast('這台裝置沒辦法存備份檔'); }
  };
  const pickRestore = () => { if (fileRef.current) { fileRef.current.value = ''; fileRef.current.click(); } };
  const onFile = e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try { setPendingRestore(parseBackup(String(r.result))); }
      catch (err) { showToast('這個檔案不是 Blossom 的備份'); }
    };
    r.onerror = () => showToast('讀不到這個檔案');
    r.readAsText(f);
  };

  const setView = v => {
    if (v === view) return;
    setPage({ name: 'home', anim: VIEWS.indexOf(v) > VIEWS.indexOf(view) ? 'in-r' : 'in-l' });
    setViewState(v); uiSet({ view: v }); setCalAnim('');
  };
  const go = (name, anim) => { setPage({ name, anim: anim || '' }); try { window.scrollTo(0, 0); } catch (e) {} };
  const shiftMonth = dir => {
    const n = mOff + dir; if (n > 12 || n < -240) return;
    setCalAnim(dir > 0 ? 'in-r' : 'in-l'); setMOff(n);
  };
  const jumpMonth = () => { if (mOff === 0) { setMSel(today); return; } setCalAnim(mOff < 0 ? 'in-r' : 'in-l'); setMOff(0); setMSel(today); };
  const setYear = y => { setCalAnim(y > year ? 'in-r' : 'in-l'); setYearState(y); };
  // main → record: the page around the flower fades, then the card grows its white sheet
  const openRecord = d => {
    if (busy.current) return; busy.current = true;
    setLeaving(true);
    setTimeout(() => { setLeaving(false); setPage({ name: 'record', date: d, anim: '' }); busy.current = false; try { window.scrollTo(0, 0); } catch (e) {} }, 200);
  };
  // record → main: the sheet folds up and the flower moves back down; the main page then only fades its other parts in
  const closeRecord = () => {
    if (busy.current) return; busy.current = true;
    setLeaving(true);
    setTimeout(() => { setLeaving(false); setPage({ name: 'home', anim: 'from-rec' }); busy.current = false; try { window.scrollTo(0, 0); } catch (e) {} }, 400);
  };
  // tap a day to mark or unmark the period (asks first when records would be lost)
  const applyMark = plan => {
    store.applyMark(plan);
    setPop(p => ({ d: plan.d, n: (p ? p.n : 0) + 1 }));
  };
  const markDay = d => {
    if (d > today) { showToast('未來的日子還不能標記哦'); return; }
    const plan = store.planMark(d);
    if (plan.kind === 'delete' || plan.lost) setConfirmMark(plan); else applyMark(plan);
  };
  const openCycleMonth = s => {
    const k = (+s.slice(0, 4) - +today.slice(0, 4)) * 12 + (+s.slice(5, 7) - +today.slice(5, 7));
    setMOff(k); setMSel(s); setCalAnim('');
    setPage({ name: 'home', anim: 'in-r' }); setViewState('month'); uiSet({ view: 'month' });
    try { window.scrollTo(0, 0); } catch (e) {}
  };
  const toggleTheme = () => {
    const root = document.documentElement;
    let dark;
    if (store.data.theme) dark = store.data.theme === 'dark';
    else if (root.getAttribute('data-theme')) dark = root.getAttribute('data-theme') === 'dark';
    else dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    store.setTheme(dark ? 'light' : 'dark');
  };
  const openSettings = () => go('settings', 'in-r');
  const common = { store, today, toggleTheme, openSettings, view, setView, showToast };
  // the main page is pinned in place; every other page scrolls when it needs to
  const pinned = page.name === 'home' && view === 'main';
  useEffect(() => {
    document.documentElement.classList.toggle('lock', pinned);
    if (pinned) try { window.scrollTo(0, 0); } catch (e) {}
  }, [pinned]);

  let body;
  if (page.name === 'settings') body = html`<${Settings} store=${store} toggleTheme=${toggleTheme} onClose=${() => go('home', 'in-l')} onBackup=${doBackup} onPickRestore=${pickRestore} openCycle=${() => go('cycle', 'in-r')} />`;
  else if (page.name === 'cycle') body = html`<${CycleSettings} store=${store} toggleTheme=${toggleTheme} onClose=${() => go('settings', 'in-l')} />`;
  else if (page.name === 'record') body = html`<${Record} store=${store} date=${page.date} toggleTheme=${toggleTheme} onDone=${closeRecord} leaving=${leaving} showToast=${showToast} />`;
  else if (view === 'month') body = html`<${Month} ...${common} mOff=${mOff} shiftMonth=${shiftMonth} jumpMonth=${jumpMonth} mSel=${mSel} setMSel=${setMSel} calAnim=${calAnim} markDay=${markDay} pop=${pop} />`;
  else if (view === 'year') body = html`<${Year} ...${common} year=${year} setYear=${setYear} calAnim=${calAnim} openCycleMonth=${openCycleMonth} />`;
  else body = html`<${Home} ...${common} sel=${sel} setSel=${setSel} openRecord=${openRecord} leaving=${leaving} anim=${page.anim} markDay=${markDay} pop=${pop} />`;

  const pageKey = page.name === 'home' ? 'home-' + view : page.name;
  const wrapAnim = page.anim === 'from-rec' ? '' : page.anim;
  return html`<${React.Fragment}>
    <div key=${pageKey} className=${wrapAnim}>${body}</div>
    ${confirmMark && html`<div className="overlay fade-in" onClick=${e => { if (e.target === e.currentTarget) setConfirmMark(null); }}>
      <div className="dialog pop-in" role="dialog" aria-modal="true" aria-labelledby="cm-t">
        <div id="cm-t" className="dlg-title">${confirmMark.kind === 'delete' ? '取消 ' + md(confirmMark.p.s) + ' 開始的經期？' : '經期改到 ' + md(addD(confirmMark.d, -1)) + ' 結束？'}</div>
        <div className="dlg-text">${confirmMark.kind === 'delete'
          ? (confirmMark.lost ? '這幾天記的月經量也會一起刪掉，其他紀錄會留著' : '這幾天就不再算成經期')
          : md(confirmMark.d) + (confirmMark.d < confirmMark.p.e ? '–' + md(confirmMark.p.e) : '') + ' 記的月經量會一起刪掉'}</div>
        <div className="dlg-btns">
          <button className="pill bl" onClick=${() => setConfirmMark(null)}>保留</button>
          <button className="pill danger bl" onClick=${() => { applyMark(confirmMark); setConfirmMark(null); }}>${confirmMark.kind === 'delete' ? '取消經期' : '確定'}</button>
        </div>
      </div>
    </div>`}
    ${pendingRestore && html`<div className="overlay fade-in" onClick=${e => { if (e.target === e.currentTarget) setPendingRestore(null); }}>
      <div className="dialog pop-in" role="dialog" aria-modal="true" aria-labelledby="rs-t">
        <div id="rs-t" className="dlg-title">用這份備份還原？</div>
        <div className="dlg-text">備份日期 ${pendingRestore.exportedAt ? fmtDate(pendingRestore.exportedAt) : '不明'}，有 ${pendingRestore.periods.length} 次經期紀錄，目前手機上的紀錄會被這份備份取代</div>
        <div className="dlg-btns">
          <button className="pill bl" onClick=${() => setPendingRestore(null)}>取消</button>
          <button className="pill primary bl" onClick=${() => { store.restore(pendingRestore); setPendingRestore(null); go('home', 'in-l'); showToast('還原好了'); }}>還原</button>
        </div>
      </div>
    </div>`}
    <input ref=${fileRef} id="restore-file" type="file" accept="application/json,.json" style=${{ display: 'none' }} onChange=${onFile} />
    ${toast && html`<div className="toast fade-in" role="status">${toast}</div>`}
  </${React.Fragment}>`;
}

ReactDOM.createRoot(document.getElementById('app')).render(html`<${App} />`);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
